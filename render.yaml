services:
  - type: web
    name: falkortrace
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FALKORDB_HOST
        value: r-6jissuruar.instance-3zbnvvx0i.hc-7up0crkyn.ap-south-1.aws.f2e0a955bb84.cloud
      - key: FALKORDB_PORT
        value: 53164
      - key: FALKORDB_USERNAME
        value: falkordb
      - key: FALKORDB_PASSWORD
        sync: false
      - key: FALKORDB_SSL
        value: "true"
