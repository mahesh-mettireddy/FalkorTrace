services:
  falkordb:
    image: falkordb/falkordb:v4.2.0
    container_name: falkortrace-db
    ports:
      - "6379:6379"
      - "3000:3000"
    volumes:
      - falkordb_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  falkortrace-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: falkortrace-app
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - FALKORDB_HOST=falkordb
      - FALKORDB_PORT=6379
      - FALKORDB_USERNAME=${FALKORDB_USERNAME:-}
      - FALKORDB_PASSWORD=${FALKORDB_PASSWORD:-}
      - FALKORDB_SSL=${FALKORDB_SSL:-false}
      - FALKORTRACE_STRICT_DB=${FALKORTRACE_STRICT_DB:-1}
      - FALKORTRACE_ADMIN_TOKEN=${FALKORTRACE_ADMIN_TOKEN:-}
      - FALKORTRACE_CORS_ORIGINS=${FALKORTRACE_CORS_ORIGINS:-http://localhost:8000}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12
    depends_on:
      falkordb:
        condition: service_healthy
    restart: unless-stopped

volumes:
  falkordb_data:
